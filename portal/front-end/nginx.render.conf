# Render-specific variant of `nginx.conf`. Docker Compose lets nginx resolve the backend via
# its own embedded DNS (`api`, a service name on the compose network) — Render gives each
# service a real public hostname instead, with no shared internal DNS the free tier can rely
# on. The only functional change from `nginx.conf` is the proxy target: `__API_UPSTREAM_HOST__`
# is a literal placeholder (not an nginx variable — deliberately not `$`-prefixed, so it can
# never collide with a real nginx variable), replaced once at container start by
# `docker-entrypoint.render.sh` with the backend service's actual Render hostname from
# `API_UPSTREAM_HOST`. Everything else — gzip, caching, SPA fallback, the health endpoint — is
# identical to `nginx.conf`.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # A real public resolver, not Docker's embedded 127.0.0.11 — Render containers have normal
    # outbound DNS, but nginx never reads /etc/resolv.conf on its own for a `proxy_pass` that
    # uses a variable, so it must be told one explicitly.
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    # Reverse proxy to the backend's public Render URL over HTTPS. Still a transparent pipe for
    # the `Set-Cookie`/`Cookie` headers (see nginx.conf's own note on why that matters) — the
    # browser only ever talks to this container's origin either way.
    location /api/ {
        set $upstream_api https://__API_UPSTREAM_HOST__;
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Host              __API_UPSTREAM_HOST__;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

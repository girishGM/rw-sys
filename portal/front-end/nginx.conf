# T-052 — serves the built SPA and reverse-proxies the API, so the browser only ever talks to
# one origin. This is what makes `front-end/src/lib/apiClient.ts`'s same-origin `/api/v1/*`
# baseURL (`DEFAULT_BASE_URL`) true in a deployed container the same way Vite's own dev-server
# proxy (`front-end/vite.config.ts`) makes it true locally — and, more importantly, what keeps
# every session cookie first-party (R5: cookies only, and a cookie set by a cross-origin API
# response is the one thing that would force this app onto `localStorage` instead).
#
# Listens on 8080, not 80: this container runs as the non-root `nginx` user
# (`front-end/Dockerfile`'s `USER nginx`), and binding a port below 1024 needs root.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No version disclosure (the same 03-API-CONTRACT.md §14 rule `HealthController` follows) —
    # nginx's own `Server: nginx/1.27.x` header is suppressed for every response.
    server_tokens off;

    # T-053 — gzip compression. `alpine`'s stock `nginx:1.27-alpine` base ships `gzip off;` by
    # default, and nothing in this file or `nginx.main.conf` had ever turned it on — found live
    # while investigating TC-15 (Dashboard FCP on Fast 3G): the SPA's own entry bundle is 159 KB
    # gzipped (`.size-limit.json`'s own budget, `front-end`'s real build output) but this
    # container was serving it at its full, uncompressed 520 KB every time
    # (`curl -H 'Accept-Encoding: gzip' … -D -` against a running container showed no
    # `Content-Encoding` header at all, `Content-Length: 520233`) — a >3x larger payload than the
    # bundle-budget gate (TC-12, `size-limit`) had ever actually measured, because `size-limit`
    # reads the build artefact directly and never went through this proxy. That gap is exactly
    # what turned into TC-15's real, measured failure (Dashboard FCP ~3.3s on Fast 3G, budget
    # 1.5s) — not a slow API, not a bloated bundle (TC-12 was and still is green), but this
    # container silently shipping the wrong bytes. `text/html`/`text/css` are included even
    # though `index.html` itself is tiny, for the same reason every other production nginx config
    # compresses them: cheap, and one line saved is one line saved. `image/svg+xml` is the one
    # asset type this SPA actually ships inline SVGs as; other binary/already-compressed types
    # (fonts, PNGs — neither currently shipped, but a safe default) are deliberately left off the
    # list, since gzipping already-compressed bytes wastes CPU for no size win.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Docker's embedded DNS (127.0.0.11) resolving `api` at REQUEST time, not once at config
    # load. A bare `proxy_pass http://api:3000` resolves the hostname when nginx starts and
    # never again — if the `api` container is not yet up (a startup race docker-compose's own
    # `depends_on` narrows but does not fully close) or is later recreated with a new IP (a
    # restart, a redeploy), nginx would either refuse to start at all or keep proxying to a
    # dead address. Routing through a variable forces nginx down the request-time resolution
    # path instead.
    resolver 127.0.0.11 valid=10s;

    # Reverse proxy to the `api` service (docker-compose.yml's own service name).
    # `/api` is forwarded whole, unrewritten, so the backend's own `api/v1` global prefix
    # (`back-end/src/main.ts`) is exactly what both the browser and the backend see.
    location /api/ {
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies are the whole auth model (R5) — nothing here rewrites, strips or reads one;
        # this proxy is a transparent pipe for the `Set-Cookie`/`Cookie` headers the backend
        # and browser exchange directly.
    }

    # `GET /health`/`/health/ready` are proxied like any other `/api` route above — this
    # location exists only so `docker compose`'s own healthcheck (docker-compose.yml) can probe
    # the SPA container itself without going through the `/api/` prefix rewrite mentally; it is
    # not a second implementation of either endpoint.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Client-side routing (react-router-dom, T-020): any path that is not a real static file
    # falls back to index.html, so a hard refresh on e.g. /campaigns/8821 does not 404 against
    # nginx before React Router ever sees the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed, immutable Vite build assets (`/assets/*.<hash>.js`/`.css`) — safe to cache
    # forever; a new deploy ships new filenames, never a mutated old one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself must never be cached this aggressively — it is the one file that
    # actually changes on every deploy (it references the new hashed asset filenames).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

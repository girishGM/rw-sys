# T-052 — the main nginx config, replacing the base `nginx:1.27-alpine` image's own
# `/etc/nginx/nginx.conf` for exactly two reasons, both required to run as the non-root
# `nginx` user this Dockerfile's `USER nginx` sets (TC-14), and both confirmed by actually
# running this image as that user while verifying it:
#
#  1. No `user nginx;` directive — that directive exists to tell a **root** master process
#     which unprivileged user to drop to for its workers; running as `nginx` already, it is a
#     no-op that only prints a startup warning ("the 'user' directive makes sense only if the
#     master process runs with super-user privileges").
#  2. `pid /tmp/nginx.pid;` instead of the default `/run/nginx.pid` — `/run` (`/var/run`) can be
#     a fresh mount on every container start on some container runtimes, so a `chown` baked
#     into the image (unlike the one this Dockerfile applies to `/var/cache/nginx`, which is
#     not remounted) has no effect on it at runtime, and `nginx` cannot create the pidfile
#     there. `/tmp` is always writable and always available.
#
# Everything else is the base image's own file, unchanged, down to the log format.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

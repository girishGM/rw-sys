name: portal-e2e

# See portal/.github/workflows/ci.yml's own note: this file lives at portal/.github/workflows/
# per T-001's file list, on the assumption that `portal/` becomes its own repository root. If
# `reward-system/` is git-initialised as the repo instead, copy or symlink this file to
# reward-system/.github/workflows/e2e.yml (paths below already assume `portal/` as the working
# directory, matching ci.yml's own convention).
#
# T-050's own suite manages its stack itself (Testcontainers Postgres, the real back end and
# front end as child processes — see e2e/global-setup.ts) rather than through this workflow's own
# `services:`, so the only jobs of this file are: give it a Docker daemon (every GitHub-hosted
# Ubuntu runner already has one), give it Node 20, and give it the same npm-ci discipline every
# other workspace in this repo uses.

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: portal

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # The portal workspace itself (back-end/front-end/packages/shared) — e2e/'s own
      # dependencies are installed separately below, since e2e is a standalone npm project (see
      # e2e/package.json's own header for why).
      - name: Install portal workspace dependencies
        run: npm ci

      - name: Install e2e dependencies
        working-directory: portal/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: portal/e2e
        run: npx playwright install --with-deps chromium

      # DoD: "all specs green on three consecutive runs including a parallel run." Run 1 and run 2
      # are single-worker (the default); run 3 is the explicit parallel run verification step 2
      # names. Each run boots and tears down its own ephemeral Postgres container
      # (globalSetup/globalTeardown) — three genuinely independent runs, not one run repeated by
      # a retry.
      - name: E2E run 1/3
        working-directory: portal/e2e
        run: npm run e2e

      - name: E2E run 2/3
        working-directory: portal/e2e
        run: npm run e2e

      - name: E2E run 3/3 (parallel, 4 workers)
        working-directory: portal/e2e
        run: npm run e2e -- --workers=4

      - name: Accessibility run (TZ=UTC, verification steps 4-5)
        working-directory: portal/e2e
        env:
          TZ: UTC
        run: npm run e2e:a11y

      # Inherited T-057 TC-3 ("npm run build then npm start, no ts-node — the suite runs against
      # the built artefact at least once", T-050-e2e-tests.md's "Inherited acceptance criteria"
      # table): one full run against back-end/dist/main.js rather than ts-node. Not one of the
      # three DoD runs above — this is the release-blocking path T-057 itself exists to prove,
      # exercised here once rather than on every run, since the extra `npm run build` is real
      # wall-clock cost the DoD's "three consecutive runs" wording is about the ts-node path, not
      # this one.
      - name: E2E run (built back-end artefact, no ts-node — inherited T-057 TC-3)
        working-directory: portal/e2e
        env:
          E2E_BACKEND_MODE: built
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            portal/e2e/playwright-report
            portal/e2e/test-results
          retention-days: 14

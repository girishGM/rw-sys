# The main nginx config, replacing the base `nginx:1.27-alpine` image's own `/etc/nginx/nginx.conf`
# — identical fix to portal/front-end/nginx.main.conf, needed for exactly the same reason (running
# as the non-root `nginx` user this Dockerfile's `USER nginx` sets): no `user nginx;` directive
# (a no-op once already running as that user, only prints a startup warning), and
# `pid /tmp/nginx.pid;` instead of the default `/run/nginx.pid` (`/run` isn't guaranteed writable
# by `nginx` at container start; `/tmp` always is). Confirmed live — the default main config fails
# outright with "open() '/run/nginx.pid' failed (13: Permission denied)" without this.
#
# Everything else is the base image's own file, unchanged.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

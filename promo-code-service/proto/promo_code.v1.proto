// T-PC-031. Copied field-for-field from `03-GRPC-CONTRACT.md` §1 — message names, field names,
// field numbers and types exactly as specified there. Do not rename a field to something that
// reads better in proto style: the whole point (per that doc's closing note) is structural
// identity with the Kafka `promo-code.generate.requested.v1`/`promo-code.generate.result.v1`
// payloads (`02-KAFKA-CONTRACTS.md` §3/§5), not proto idiom, so both transports can call the
// identical `PromoCodeGenerationService.generateCode()` without a translation layer that could
// drift between them.
//
// `amount`/`reward_value` are `string`, never a numeric proto type (§2): binary floating point
// cannot represent monetary decimals exactly.
//
// T-PC-061 (defect fix, filed against T-PC-058): `version_no` added to both `GenerateCodeRequest`
// (an explicit, frozen-at-grant-time version pin an upstream caller may already have resolved —
// `02-KAFKA-CONTRACTS.md` §3's own `promo-code.generate.requested.v1` mirrors this field for the
// same reason) and `GenerateCodeResponse` (the resolved version, echoed back — `02-KAFKA-CONTRACTS.md`
// §5's `promo-code.generate.result.v1` mirrors this too). Both are appended as new field numbers,
// never reusing or renumbering an existing one — an existing caller that omits `version_no`
// entirely is unaffected (proto3 default: empty string). **Wire contract only**: actually resolving
// an explicit `version_no` against `promo_code_config_version` and populating the response field
// with the real resolved value is `PromoCodeGenerationService`'s own job (T-PC-060,
// `agent-promo-generation`'s scope, not this file's) — `GenerateCodeResponse.version_no` is emitted
// as `""` by `promo-code.controller.ts` until that lands; see that file's own comment.

syntax = "proto3";

package promocode.v1;

service PromoCodeService {
  // Synchronous code generation — the sync alternative to publishing onto
  // promo-code.generate.requested.v1. Same idempotency semantics (02-KAFKA-CONTRACTS.md §4):
  // a retried call with the same correlation_id returns the original result, never a second code.
  rpc GenerateCode (GenerateCodeRequest) returns (GenerateCodeResponse);

  // Read-only. Same rows GET /api/v1/promo-code-configs serves the portal (04-API-CONTRACT.md
  // §1); exposed over gRPC too since reward-redemption-service may need it without an HTTP hop.
  rpc ListActivePromoCodeConfigs (ListActivePromoCodeConfigsRequest) returns (PromoCodeConfigList);
}

message GenerateCodeRequest {
  string correlation_id  = 1;
  string tenant_id       = 2;
  string bind_level      = 3;   // "CAMPAIGN" | "TRACKER" | "COMPONENT"
  string bind_ref_id     = 4;
  string customer_id     = 5;
  string merchant_id     = 6;   // optional — empty string if absent
  ActivityContext activity_context = 7;
  // T-PC-061: optional explicit version pin (frozen-at-grant-time, resolved upstream by the
  // caller) — empty string if absent, in which case resolution falls back to the binding's own
  // currently-pinned version (T-PC-060). New field, appended — never renumbers 1-7 above.
  string version_no      = 8;
}

message ActivityContext {
  string amount    = 1;   // decimal-as-string — never a float (03-GRPC-CONTRACT.md §3)
  string currency  = 2;
  string metadata_json = 3;   // free-form, opaque, passed through only
}

message GenerateCodeResponse {
  string status              = 1;   // "SUCCESS" | "FAILED"
  string promo_code_id       = 2;
  string code                = 3;
  string reward_value_type   = 4;
  string reward_value        = 5;   // decimal-as-string
  string reward_unit         = 6;
  string expires_at          = 7;   // ISO 8601, empty if none
  string error_code          = 8;
  string error_message       = 9;
  // T-PC-061: the resolved version_no this code was actually generated under — populated only on
  // SUCCESS, empty string on FAILED (same convention as `code`/`reward_value` above) or when the
  // resolving `PromoCodeGenerationService` doesn't yet populate it (T-PC-060, not this file's own
  // scope — see this file's header comment). New field, appended — never renumbers 1-9 above.
  string version_no          = 10;
}

message ListActivePromoCodeConfigsRequest {
  string tenant_id    = 1;
  string merchant_id  = 2;   // optional
}

message PromoCodeConfigList {
  repeated PromoCodeConfigSummary configs = 1;
}

message PromoCodeConfigSummary {
  string id                  = 1;
  string name                = 2;
  string reward_value_type   = 3;
  string reward_value        = 4;
  string reward_unit         = 5;
}

# Render Blueprint for reward-tracking-service — a DEMO/first-deploy topology, not a guaranteed
# one-click production deploy (same caveat `promo-code-service/render.yaml`/
# `reward-redemption-service/render.yaml`'s own headers give: Render's Blueprint field names shift
# between versions and this was written without a live Render account to verify against — if "New
# + Blueprint" rejects a field here, Render's own error names exactly which one; fix or delete
# that line and re-sync, everything else is unaffected).
#
# This service reuses the SAME Postgres instance `portal/render.yaml`/`promo-code-service/render.yaml`/
# `reward-redemption-service/render.yaml` already provision (`reward-portal-db`) — a new schema
# (`reward_tracking`) and a new least-privilege role (`reward_tracking_app`, created by this
# service's own T-RTS-002 migration) on that one database, not a second database
# (ARCHITECTURE.md §4/§5). There is deliberately no `databases:` block below — this file never
# provisions Postgres itself.
#
# Render's `fromDatabase:` field-linking only resolves references WITHIN the same Blueprint file.
# This is a separate Blueprint (its own file, its own service group) pointed at that already-existing
# database, so DB_HOST/DB_PORT/DB_NAME below are plain `sync: false` manual-entry vars instead — the
# exact same pattern every sibling service's own `render.yaml` already uses. A human copies these
# three from that instance's own dashboard once, since it is the same physical database.
#
# Two roles, two credential groups, same split every sibling service's own migration already
# creates correctly — this file must not collapse them into one:
#   DB_APP_*        `reward_tracking_app` (least-privilege, scoped to the `reward_tracking` schema
#                   only, AGENT-PROTOCOL.md R2) — what the running `runtime` container actually
#                   uses.
#   DB_MIGRATION_*  the privileged role used ONLY by the `migrator` build target's one-off
#                   `db:migrate` run (Dockerfile) — never read by the running service, and
#                   deliberately not wired to any Render-managed service below. Running the
#                   migration against a live Render database is a manual step (see this task's own
#                   `reward-tracking-service-plan/reports/T-RTS-046-deploy-checklist.md` and
#                   T-RTS-045's own render-migration-plan.md), not something this file executes on
#                   its own (R13).
#
# `KAFKA_BROKERS` similarly cannot be given a real value here: this Blueprint stands up no Kafka
# cluster on Render (ARCHITECTURE.md §4 — local dev only via `docker-compose.yml`'s own Redpanda),
# so it is `sync: false`, to be pointed at a real, reachable broker list once one exists.
#
# **This file declares exactly ONE Render service — the primary HTTP API (`dist/main.js`:
# `/health` + the customer/admin rewards REST surface, T-RTS-001/030/031/032) — mirroring every
# sibling service's own `render.yaml` (none of which declares more than one `services:` entry
# either).** This service has three OTHER standalone bootstrap entry points this same Docker image
# also ships (see `Dockerfile`'s own header): the inbound gRPC ingest server
# (`dist/grpc/grpc-server.main.js`, T-RTS-011), the `reward.redemption.completed.v1` Kafka consumer
# (`dist/kafka/kafka-consumer.main.js`, T-RTS-012), and the REST-fallback ingest listener
# (`dist/modules/ingestion/reward-tracking-ingest-http.main.js`, T-RTS-013 — see that file's own
# header: this one is explicitly flagged as "a standalone verification process", not yet the
# intended long-term shape; wiring it into the primary HTTP app above is a still-open follow-up
# outside this task's own file scope, named explicitly in the deploy checklist rather than
# silently assumed away). Every one of those three needs ITS OWN Render service (Background
# Worker, since none of them serve inbound HTTP traffic Render's load balancer would route to) —
# see `reward-tracking-service-plan/reports/T-RTS-046-deploy-checklist.md` §3 for the exact,
# named manual steps (each one's own `dockerCommand`/env vars), not encoded as additional
# `services:` entries here because a second/third/fourth service block in the SAME Blueprint file
# would need its own `fromService`-style wiring this repo's other Blueprints have never exercised
# either — same "prepare, don't guess at unverified syntax" discipline this file's own header
# opens with.

services:
  - type: web
    name: reward-tracking-service
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3040"

      # --- Database: the `reward_tracking` schema on the portal's EXISTING `reward-portal-db`
      # Render Postgres instance — copy these three from that instance's own dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"

      # DB_APP_* — the least-privilege `reward_tracking_app` role T-RTS-002's migration creates.
      - key: DB_APP_USERNAME
        value: reward_tracking_app
      - key: DB_APP_PASSWORD
        sync: false

      # DB_MIGRATION_* — used only by the `migrator` Docker build target's one-off CLI run (never
      # by this running service).
      - key: DB_MIGRATION_USERNAME
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false

      # --- Kafka: no broker is provisioned by this Blueprint (see header) — point this at a real,
      # reachable cluster once one exists. Required at boot even for the web service above
      # (`config.schema.ts` validates it from Wave 0 onward) even though only the separate Kafka
      # consumer WORKER service (see header, and the deploy checklist) actually opens a connection
      # to it.
      - key: KAFKA_BROKERS
        sync: false

      # --- Field encryption (T-RTS-030-era `customer-id-crypto.service.ts`) — AES-256-GCM +
      # HMAC-SHA-256 for `customerId` at rest (AGENT-PROTOCOL.md R6/R12). Both required, no
      # default — a missing/invalid key throws at first use. Independent key material — never the
      # same value for both.
      - key: FIELD_ENCRYPTION_AES_KEY
        sync: false
      - key: FIELD_ENCRYPTION_HMAC_KEY
        sync: false

      # --- This service's own two, deliberately distinct bearer secrets (never collapsed into
      # one — two different trust levels, two different callers). Both are base64-encoded and
      # must decode to at least 32 bytes (`loadCustomerAuthSecret`/`loadPortalAdminAuthSecret` —
      # confirmed by a real container run against this exact Dockerfile, see
      # `reward-tracking-service-plan/reports/T-RTS-046-deploy-checklist.md` §4; an earlier draft
      # of that checklist assumed any non-empty string sufficed, which is wrong):
      #   CUSTOMER_API_AUTH_SECRET       verifies the customer-facing bearer token
      #                                  (`customer-auth.guard.ts`, T-RTS-030/032) — minted
      #                                  upstream (an OTP flow, a carrier session, a mobile app
      #                                  login), never by this service; this service only
      #                                  verifies it.
      #   PORTAL_ADMIN_API_AUTH_SECRET   verifies the portal-admin-facing bearer token
      #                                  (`portal-admin-auth.guard.ts`, T-RTS-031/032) presented
      #                                  by the portal's own backend on behalf of an
      #                                  already-authenticated Maker/Checker/Merchant/Tenant/
      #                                  Country/super admin session.
      - key: CUSTOMER_API_AUTH_SECRET
        sync: false
      - key: PORTAL_ADMIN_API_AUTH_SECRET
        sync: false

      # --- REST-fallback ingest channel's own bearer token (`reward-tracking-ingest.controller.ts`,
      # T-RTS-013) — guards `POST` to the REST ingestion endpoint reward-redemption-service calls
      # when its own `dispatch_channel_config` resolves REST for a given campaign. Required with no
      # code-level default — `RewardTrackingIngestTokenGuard` throws
      # `MissingRewardTrackingIngestTokenError` at construction if unset. Listed here (the web
      # service) even though this channel does not run in THIS service today — see header — so the
      # var is provisioned once and ready the moment that gap closes.
      - key: REWARD_TRACKING_INGEST_TOKEN
        sync: false

      # --- Portal gRPC client + cached campaign/tracker/reward hierarchy feed
      # (`campaign-hierarchy.client.ts`, T-RTS-020). PORTAL_CONFIG_TENANT_IDS is required, no
      # default — `resolveConfiguredTenantIds()` throws if unset. HOST/PORT/TIMEOUT_MS/
      # WATCH_RECONNECT_MS/TLS_* all have safe code-level defaults (localhost/50051/5000ms/5000ms/
      # insecure) and are listed here only as sync:false placeholders for operator discoverability,
      # matching `.env.example`'s own documented set — leaving them unset at deploy time is fine.
      # The three TLS_* vars must be set together or not at all (a partial set throws). This
      # service's own `grpc_service_grants` row (the portal-side administrative action naming which
      # sections this cert/identity may read) is a manual, portal-side step — T-RTS-020's own
      # caveat — never something this Blueprint or this service's own code provisions.
      - key: PORTAL_CONFIG_TENANT_IDS
        sync: false
      - key: PORTAL_GRPC_HOST
        sync: false
      - key: PORTAL_GRPC_PORT
        sync: false
      - key: PORTAL_GRPC_TIMEOUT_MS
        sync: false
      - key: PORTAL_GRPC_WATCH_RECONNECT_MS
        sync: false
      - key: PORTAL_GRPC_TLS_CA_PATH
        sync: false
      - key: PORTAL_GRPC_TLS_CERT_PATH
        sync: false
      - key: PORTAL_GRPC_TLS_KEY_PATH
        sync: false

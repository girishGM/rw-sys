// T-RR-080. This service's own client-side copy of
// `promo-code-service/proto/promo_code.v1.proto` (confirmed by direct read) — message names, field
// names, field numbers and types copied exactly, mirroring `03-GRPC-CONTRACT.md` §1. Do not rename
// a field to something that reads better in proto style: structural identity with that file (and
// therefore with the REST connector's own `PromoCodeGenerateRequest`/`PromoCodeGenerateResponse`,
// `promo-code-service.connector.types.ts`, `04-REST-CONTRACT.md` §2) is the whole point — it is
// what lets `PromoCodeServiceGrpcClient` and `PromoCodeServiceConnector`'s existing REST outcome
// mapping share one classification path with no translation layer that could drift.
//
// `amount`/`reward_value` are `string`, never a numeric proto type (§2 of the source doc): binary
// floating point cannot represent monetary decimals exactly.
//
// This client only ever calls `GenerateCode` (T-RR-080's own scope) — `ListActivePromoCodeConfigs`
// is copied here too purely so this file stays a byte-for-byte mirror of the server's own contract,
// not because anything in this service calls it.
//
// T-RR-090: `version_no` (field 8 on `GenerateCodeRequest`, field 10 on `GenerateCodeResponse`)
// added to stay a byte-for-byte mirror of the real server-side
// `promo-code-service/proto/promo_code.v1.proto` (confirmed by direct read — added there by that
// service's own T-PC-061) — same field numbers, never renumbering 1-7/1-9 above. proto3 default
// (empty string) is this transport's own "absent" representation, translated at
// `promo-code-service-grpc.client.ts`'s own boundary to/from this connector's shared `string | null`
// `versionNo` (`promo-code-service.connector.types.ts`) — never left as a bare empty string past
// that one translation point.

syntax = "proto3";

package promocode.v1;

service PromoCodeService {
  // Synchronous code generation — the sync alternative to publishing onto
  // promo-code.generate.requested.v1. Same idempotency semantics (02-KAFKA-CONTRACTS.md §4):
  // a retried call with the same correlation_id returns the original result, never a second code.
  rpc GenerateCode (GenerateCodeRequest) returns (GenerateCodeResponse);

  // Read-only. Same rows GET /api/v1/promo-code-configs serves the portal (04-API-CONTRACT.md
  // §1); exposed over gRPC too since reward-redemption-service may need it without an HTTP hop.
  rpc ListActivePromoCodeConfigs (ListActivePromoCodeConfigsRequest) returns (PromoCodeConfigList);
}

message GenerateCodeRequest {
  string correlation_id  = 1;
  string tenant_id       = 2;
  string bind_level      = 3;   // "CAMPAIGN" | "TRACKER" | "COMPONENT"
  string bind_ref_id     = 4;
  string customer_id     = 5;
  string merchant_id     = 6;   // optional — empty string if absent
  ActivityContext activity_context = 7;
  // T-RR-090: optional explicit version pin, frozen at claim time upstream — empty string if
  // absent, in which case resolution falls back to the binding's own currently-pinned version.
  string version_no      = 8;
}

message ActivityContext {
  string amount    = 1;   // decimal-as-string — never a float (03-GRPC-CONTRACT.md §3)
  string currency  = 2;
  string metadata_json = 3;   // free-form, opaque, passed through only
}

message GenerateCodeResponse {
  string status              = 1;   // "SUCCESS" | "FAILED"
  string promo_code_id       = 2;
  string code                = 3;
  string reward_value_type   = 4;
  string reward_value        = 5;   // decimal-as-string
  string reward_unit         = 6;
  string expires_at          = 7;   // ISO 8601, empty if none
  string error_code          = 8;
  string error_message       = 9;
  // T-RR-090: the resolved version_no this code was actually generated under — populated only on
  // SUCCESS, empty string on FAILED (same convention as `code`/`reward_value` above).
  string version_no          = 10;
}

message ListActivePromoCodeConfigsRequest {
  string tenant_id    = 1;
  string merchant_id  = 2;   // optional
}

message PromoCodeConfigList {
  repeated PromoCodeConfigSummary configs = 1;
}

message PromoCodeConfigSummary {
  string id                  = 1;
  string name                = 2;
  string reward_value_type   = 3;
  string reward_value        = 4;
  string reward_unit         = 5;
}

// T-RR-011 — this service's own inbound `RewardIngestService.SubmitRewardEntry` server contract.
//
// Copied FIELD-FOR-FIELD, PACKAGE-FOR-PACKAGE, verbatim from
// `realtime-activity-processing-service/proto/reward_ingest.proto` (RAP's real, shipped file —
// confirmed by direct read on 2026-09-05) and from this plan's own `03-GRPC-CONTRACT.md` §1, which
// quotes that same file. This plan's task file (`T-RR-011`) and `03-GRPC-CONTRACT.md` §1's own
// "Why the package name is NOT renamed" section both explain in detail why `package
// rewardrap.reward.v1` below is NOT renamed to `rewardredemption.reward.v1` (which would otherwise
// match every other proto this repo owns, e.g. `promocode.v1`): RAP's real, shipped
// `src/modules/dispatch/reward-grpc-fallback.client.ts` (the tier-2 dispatch fallback client,
// T-RAP-034) resolves its generated client constructor as
// `proto.rewardrap.reward.v1.RewardIngestService` and therefore dials the fully-qualified gRPC
// method path `/rewardrap.reward.v1.RewardIngestService/SubmitRewardEntry` at the wire level.
// Renaming the package here would make that already-written, un-editable (R0) client dial a
// service name this server never registers, failing with `UNIMPLEMENTED` — an outage this plan has
// no way to fix from its own side. Do NOT rename this package "for consistency." Do NOT renumber
// or reuse any field number for any reason — a renumbering is a silent wire break.
//
// `activity_value`/`reward_value` stay `string` (decimal-as-string), the same float-precision-
// loss-avoidance convention every proto in this repo already applies (`campaign_config.v1.proto`
// rule 3, `promo_code.v1.proto` §2, `03-GRPC-CONTRACT.md` §1).
//
// T-INT-058: fields 26-28 (`reward_kind`/`promo_code_config_id`/`promo_code_config_version_no`)
// added field-number-for-field-number identical to RAP's own real, shipped copy of this file
// (`realtime-activity-processing-service/proto/reward_ingest.proto`, `T-RAP-062`) — this service's
// own copy had silently drifted behind RAP's after that task shipped, the exact contract-drift
// class of bug `T-INT-002` already fixed once for a different leg. Do NOT renumber or reuse any
// field number for any reason.

syntax = "proto3";

package rewardrap.reward.v1;

service RewardIngestService {
  rpc SubmitRewardEntry (RewardEntry) returns (SubmitRewardEntryAck);
}

message RewardEntry {
  string id                        = 1;   // reward_entry.id — this IS reward_entry_unique_id
  string correlation_id            = 2;
  int32  tenant_id                 = 3;
  string customer_id               = 4;   // decrypted — see this file's own header
  string customer_id_type          = 5;
  string activity_performed_date   = 6;   // full ISO-8601 with zone offset
  string transaction_type          = 7;   // OPTIONAL — empty when activity_code was used instead
  string activity_code             = 8;   // OPTIONAL — empty when transaction_type was used instead
  string activity_type             = 9;
  string activity_category         = 10;
  string activity_value             = 11;  // decimal-as-string
  string activity_value_unit       = 12;
  string channel                   = 13;
  string activity_performed_env    = 14;
  string activity_name             = 15;
  string campaign_code             = 16;
  string tracker_code               = 17;
  string tracker_component_code    = 18;
  string merchant_code             = 19;  // OPTIONAL
  string reward_code               = 20;
  string reward_category           = 21;
  string reward_value              = 22;  // decimal-as-string
  string reward_value_unit         = 23;
  string reward_entry_date         = 24;  // full ISO-8601 with zone offset
  int32  completion_cycle          = 25;
  // T-RAP-062 / T-INT-058: descriptive-only metadata mirrored from BoundReward at grant time —
  // never a new enforcement input. OPTIONAL — empty string / 0 means "not set / not applicable",
  // same proto3 "absent means zero value" convention every other optional field in this message
  // uses.
  string reward_kind               = 26;
  string promo_code_config_id      = 27;  // meaningful only when reward_kind == "PROMO_CODE"
  int32  promo_code_config_version_no = 28;
}

message SubmitRewardEntryAck {
  string reward_entry_id = 1;
  string status           = 2;
}

# Render Blueprint for reward-redemption-service — a DEMO/first-deploy topology, not a
# guaranteed one-click production deploy (same caveat `promo-code-service/render.yaml`'s own
# header gives: Render's Blueprint field names shift between versions and this was written
# without a live Render account to verify against — if "New + Blueprint" rejects a field here,
# Render's own error names exactly which one; fix or delete that line and re-sync, everything
# else is unaffected).
#
# This service reuses the SAME Postgres instance `portal/render.yaml` and
# `promo-code-service/render.yaml` already provision (`reward-portal-db`) — a new schema
# (`reward_redemption`) and a new least-privilege role (`rr_app`, created by this service's own
# T-RR-003 migration) on that one database, not a second database (ARCHITECTURE.md §4/§5). There
# is deliberately no `databases:` block below — this file never provisions Postgres itself.
#
# Render's `fromDatabase:` field-linking only resolves references WITHIN the same Blueprint
# file. This is a separate Blueprint (its own file, its own service group) pointed at that
# already-existing database, so DB_HOST/DB_PORT/DB_NAME below are plain `sync: false`
# manual-entry vars instead — the exact same pattern `promo-code-service/render.yaml` already
# uses. A human copies these three from that instance's own dashboard once, since it is the same
# physical database.
#
# Two roles, two credential groups — this file must not collapse them into one:
#   DB_APP_*        `rr_app` (least-privilege, scoped to the `reward_redemption` schema only,
#                   AGENT-PROTOCOL.md R1/R5) — what the running `runtime` container actually
#                   uses.
#   DB_MIGRATION_*  the privileged role used ONLY by the `migrator` build target's one-off
#                   `db:migrate` run (Dockerfile) — never read by the running service, and
#                   deliberately not wired to any Render-managed service below. Running the
#                   migration against a live Render database is a manual step (T-RR-046/T-RR-047,
#                   R11), not something this file executes on its own.
#
# `KAFKA_BROKERS` similarly cannot be given a real value here: this Blueprint stands up no Kafka
# cluster on Render (`02-KAFKA-CONTRACTS.md` §4), so it is `sync: false`, to be pointed at a
# real, reachable broker list once one exists.
#
# This service's own four, deliberately distinct bearer tokens (R9, `04-REST-CONTRACT.md`
# §1/§2/§3/§4 — "never let a single token authorize both trust levels"), each its own
# `sync: false` entry, never collapsed:
#   REWARD_ENTRY_INGEST_TOKEN   guards inbound `POST /api/v1/reward-entries` (T-RR-013).
#   CACHE_ADMIN_TOKEN           guards `POST /api/v1/cache/invalidate` (T-RR-007).
#   GENERATION_SERVICE_TOKEN    this service's own outbound credential presented to
#                               promo-code-service's `POST /api/v1/promo-codes/generate`
#                               (T-RR-031) — never the same value as either token above, and
#                               never given to any other service's own Render Blueprint.
#   REWARD_TRACKING_REST_TOKEN  this service's own outbound bearer credential for the tier-2 REST
#                               fallback call to reward-tracking-service's
#                               POST /api/v1/redemptions/completed (T-RR-035). Required with no
#                               code-level default — `reward-tracking-rest.client.ts` throws
#                               `MissingRewardTrackingRestTokenError` at construction if unset
#                               (T-RR-066).
#
# T-RR-073: this file used to stop at the three tokens above and the DB/Kafka vars, omitting
# every other required-with-no-default var `src/config/config.schema.ts` (T-RR-004),
# `campaign-config.client.ts` (T-RR-022), `encryption.service.ts` (T-RR-005) and
# `reward-tracking-rest.client.ts` (T-RR-066) each throw on at boot/construction if unset — a
# Blueprint apply of the file as it stood would have deployed a container that never reaches
# `app.listen()`. All of them are now listed as `sync: false` placeholders below, grouped with
# the feature area that owns them, matching `.env.example`'s own documented set exactly.
#
# Applying this Blueprint against the shared Render environment is **not** this task's job — R11
# forbids executing a production-affecting action without the operator's recorded go-ahead; this
# task only prepares and locally validates the file's shape (there is no `render` CLI dry-run in
# this repo's toolchain today; a careful read against the two sibling files' own proven shape is
# the verification this task actually performs).
#
# T-INT-047: a SECOND service below, `type: worker`, runs the already-shipped standalone
# `claim-worker.main.ts` composition root (T-RR-058) unconditionally — this is the real deployment
# shape for the claim-worker/processing/dispatch pipeline (`ClaimWorkerModule` ->
# `RedemptionProcessingOrchestrator` -> `RedemptionStateMachineModule` ->
# `CompletionSweepService`/`OutboxPublisherService`), not the `web` service's own hybrid-bootstrap
# `CLAIM_WORKER_ENABLED` gate (`src/main.ts`, local/dev convenience only, defaults OFF there). A
# poll-loop background worker is a different operational profile from an HTTP request/response
# process (no inbound listener, no `/health` of its own, restarts don't drop in-flight HTTP
# connections because there are none) — `claim-worker.main.ts`'s own header already recommends this
# exact shape ("a dedicated Render worker service"), and Render's own `worker` service type exists
# specifically for this: no `healthCheckPath`, no exposed port, `plan: free` still applies. Reuses
# the SAME `runtime: docker`/`dockerfilePath`/`dockerContext` as the `web` service above — the
# `runtime` build stage (Dockerfile) already compiles `dist/modules/processing/claim-worker.main.js`
# alongside `dist/main.js`, nothing new to build. Needs the same DB/encryption/connector-token env
# surface as the `web` service (the claim worker constructs virtually the same provider graph:
# `TenantSchemaCacheModule`, the two real connectors, `DispatchModule`/`NotificationModule` via
# `RedemptionStateMachineModule`) plus `config.schema.ts`'s own unconditional `GRPC_SERVER_TLS_*`
# validation (this process's own `ConfigModule` still loads the full schema even though it never
# starts a gRPC listener) — so this block intentionally duplicates the `web` service's envVars list
# rather than inventing a narrower one, to avoid a boot-time crash on some var this analysis missed.
# `CLAIM_WORKER_ENABLED` is deliberately NOT set here — unset defaults to enabled for the standalone
# process (`claim-worker.module.ts`'s own convention, `.env.example`'s own note), matching "a worker
# process's whole job is to run this" (task file TC-2).
#
# T-INT-053. `PROMO_CODE_KAFKA_REPLY_CONSUMER_ENABLED` (src/main.ts's own hybrid-bootstrap gate,
# `.env.example`'s own note has the full mechanism) is deliberately NOT added as an envVar to either
# service below — that gate is local/dev convenience only for a hybrid single-process run, and does
# NOT need to be (and, per that gate's own hard-`CLAIM_WORKER_ENABLED`-dependency rule, should NOT
# be) enabled on the `web` service here. On direct investigation, this task found the `web` service
# never sets `CLAIM_WORKER_ENABLED` and so never constructs the DI graph
# `PromoCodeServiceConnector`/`requestAndAwaitReply()` lives in at all — the ONLY process on Render
# that ever resolves that graph is the dedicated `worker` service below (`claim-worker.main.ts`,
# T-INT-047).
#
# **Retry 1 (widened scope, per independent review):** the first attempt at this task fixed only
# `src/main.ts`'s own gate and left this exact gap open — flagged here at the time, not silently
# redesigned, but the review correctly found that left the real defect (every real Kafka-primary
# `rr-to-promo-code` redemption on Render exhausting its retry budget) unfixed in the one topology
# that matters. This task's own "Files owned" list is now widened to include
# `claim-worker.main.ts` itself (the `worker` service's own composition root): that file's own
# `bootstrap()` now also resolves `PromoCodeServiceKafkaClient` from the SAME
# `INestApplicationContext` it already constructs for the claim worker (never a second, independent
# context — same in-memory pending-reply-registry reasoning `src/main.ts`'s own header documents in
# full) and calls the real `.start()` on it, non-fatally (a failure is logged, never crashes the
# worker process — see that file's own header). No new envVar is needed here for this half of the
# fix: unlike the opt-in `web`-service gate, the `worker` service's entire purpose is already
# running this exact pipeline, so there is no unrelated responsibility a default-on reply consumer
# here could conflict with. This closes the gap the earlier attempt's own "Deviations" section
# named: the fix now reaches Render's real, deployed `worker`-service topology, not only a local
# hybrid-bootstrapped process.

services:
  - type: web
    name: reward-redemption-service
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3030"

      # --- Inbound gRPC ingestion server (T-RR-011, RewardIngestService.SubmitRewardEntry) —
      # GRPC_SERVER_PORT has a safe code-level default (50081, src/config/config.schema.ts) so it
      # is omitted here; the four mTLS vars below do NOT — config.schema.ts fails boot immediately
      # if any is missing or blank, so all four must be set before this Blueprint is applied for
      # real (T-RR-073).
      - key: GRPC_SERVER_TLS_CA_PATH
        sync: false
      - key: GRPC_SERVER_TLS_CERT_PATH
        sync: false
      - key: GRPC_SERVER_TLS_KEY_PATH
        sync: false
      - key: GRPC_SERVER_ALLOWED_IDENTITIES
        sync: false

      # --- Database: the `reward_redemption` schema on the portal's EXISTING `reward-portal-db`
      # Render Postgres instance — copy these three from that instance's own dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"

      # DB_APP_* — the least-privilege `rr_app` role T-RR-003's migration creates.
      - key: DB_APP_USERNAME
        value: rr_app
      - key: DB_APP_PASSWORD
        sync: false

      # DB_MIGRATION_* — used only by the `migrator` Docker build target's one-off CLI run
      # (never by this running service).
      - key: DB_MIGRATION_USERNAME
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false

      # --- Kafka: no broker is provisioned by this Blueprint (see header) — point this at a
      # real, reachable cluster once one exists.
      - key: KAFKA_BROKERS
        sync: false

      # --- This service's four distinct bearer tokens (see header) — never collapsed into one.
      - key: REWARD_ENTRY_INGEST_TOKEN
        sync: false
      - key: CACHE_ADMIN_TOKEN
        sync: false
      - key: GENERATION_SERVICE_TOKEN
        sync: false
      - key: REWARD_TRACKING_REST_TOKEN
        sync: false

      # --- Portal gRPC client + cached campaign/tracker/reward config feed (T-RR-022,
      # 06-CACHING-AND-TENANT-CONFIG.md §1). PORTAL_CONFIG_TENANT_IDS is required, no default —
      # campaign-config.client.ts's loadPortalConfigTenantIds() throws if unset. HOST/PORT/
      # TIMEOUT_MS/TLS_* all have safe code-level defaults (localhost/50051/5000/insecure) and are
      # listed here only as sync:false placeholders for operator discoverability, matching
      # .env.example's own documented set — leaving them unset at deploy time is fine. The three
      # TLS_* vars must be set together or not at all (a partial set fails boot).
      - key: PORTAL_CONFIG_TENANT_IDS
        sync: false
      - key: PORTAL_GRPC_HOST
        sync: false
      - key: PORTAL_GRPC_PORT
        sync: false
      - key: PORTAL_GRPC_TIMEOUT_MS
        sync: false
      - key: PORTAL_GRPC_TLS_CA_PATH
        sync: false
      - key: PORTAL_GRPC_TLS_CERT_PATH
        sync: false
      - key: PORTAL_GRPC_TLS_KEY_PATH
        sync: false

      # --- Field encryption (T-RR-005, encryption.service.ts) — AES-256-GCM + HMAC-SHA-256 for
      # `customerId` at rest (AGENT-PROTOCOL.md R8). Both required, no default — a missing/invalid
      # key crashes the process at module construction.
      - key: FIELD_ENCRYPTION_AES_KEY
        sync: false
      - key: FIELD_ENCRYPTION_HMAC_KEY
        sync: false

  # ---------------------------------------------------------------------------------------------
  # T-INT-047. The real, always-on deployment shape for the claim-worker/processing/dispatch
  # pipeline — see this file's own header comment above for the full reasoning. `dockerCommand`
  # overrides the `runtime` stage's own default `CMD ["node", "dist/main.js"]` (Dockerfile) with the
  # claim-worker composition root's own compiled entry point instead; nothing else about the image
  # changes. No `healthCheckPath` — Render's own `worker` service type has no HTTP listener to probe
  # (this pipeline's liveness is instead whatever an operator's own log-based/DB-based monitoring
  # already watches for the claimed-row throughput this task's own evidence describes).
  # ---------------------------------------------------------------------------------------------
  - type: worker
    name: reward-redemption-service-claim-worker
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: node dist/modules/processing/claim-worker.main.js
    envVars:
      - key: NODE_ENV
        value: production

      # --- Same GRPC_SERVER_TLS_* placeholders as the `web` service above — this process's own
      # ConfigModule still loads the full config.schema.ts unconditionally (see this file's own
      # header comment), even though this process never starts a gRPC listener.
      - key: GRPC_SERVER_TLS_CA_PATH
        sync: false
      - key: GRPC_SERVER_TLS_CERT_PATH
        sync: false
      - key: GRPC_SERVER_TLS_KEY_PATH
        sync: false
      - key: GRPC_SERVER_ALLOWED_IDENTITIES
        sync: false

      # --- Database: the SAME `reward_redemption` schema / `rr_app` role the `web` service above
      # connects as — copy the same three values from that instance's own dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_APP_USERNAME
        value: rr_app
      - key: DB_APP_PASSWORD
        sync: false
      - key: DB_MIGRATION_USERNAME
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false

      # --- Kafka: `KAFKA_BROKERS` is required by config.schema.ts unconditionally (see header);
      # the dispatch leg's own outbound `reward.redemption.completed.v1` producer (T-RR-034) also
      # reads it for real once a claimed row actually reaches that step.
      - key: KAFKA_BROKERS
        sync: false

      # --- Outbound credentials this pipeline calls with for real once a row is claimed (see this
      # file's own header comment) — same four tokens the `web` service declares, never collapsed.
      - key: REWARD_ENTRY_INGEST_TOKEN
        sync: false
      - key: CACHE_ADMIN_TOKEN
        sync: false
      - key: GENERATION_SERVICE_TOKEN
        sync: false
      - key: REWARD_TRACKING_REST_TOKEN
        sync: false

      # --- Portal gRPC client + cached campaign/tracker/reward config feed — this pipeline's own
      # `TenantSchemaCacheModule`/`RewardSystemConfigModule` dependency chain needs this same feed.
      - key: PORTAL_CONFIG_TENANT_IDS
        sync: false
      - key: PORTAL_GRPC_HOST
        sync: false
      - key: PORTAL_GRPC_PORT
        sync: false
      - key: PORTAL_GRPC_TIMEOUT_MS
        sync: false
      - key: PORTAL_GRPC_TLS_CA_PATH
        sync: false
      - key: PORTAL_GRPC_TLS_CERT_PATH
        sync: false
      - key: PORTAL_GRPC_TLS_KEY_PATH
        sync: false

      # --- Field encryption — same required-with-no-default pair as the `web` service above.
      - key: FIELD_ENCRYPTION_AES_KEY
        sync: false
      - key: FIELD_ENCRYPTION_HMAC_KEY
        sync: false

      # `CLAIM_WORKER_ENABLED` is deliberately NOT listed here — see this file's own header comment
      # (unset defaults to enabled for this standalone process; a worker process's whole job is to
      # run this, task file TC-2).
